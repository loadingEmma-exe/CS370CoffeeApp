{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "w5-db-data",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "w5-db",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "selector": {
          "app": "w5-db"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "w5-db",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "w5-db"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "w5-db",
              "lesson": "week5b"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "w5-db",
                "image": "postgres:16-alpine",
                "env": [
                  {
                    "name": "POSTGRES_USER",
                    "value": "demo"
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "value": "classroom-only"
                  },
                  {
                    "name": "POSTGRES_DB",
                    "value": "orders"
                  },
                  {
                    "name": "PGDATA",
                    "value": "/var/lib/postgresql/data/pgdata"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "pg_isready",
                      "-U",
                      "demo",
                      "-d",
                      "orders"
                    ]
                  },
                  "initialDelaySeconds": 5,
                  "periodSeconds": 3
                },
                "resources": {
                  "requests": {
                    "memory": "128Mi",
                    "cpu": "100m"
                  },
                  "limits": {
                    "memory": "512Mi",
                    "cpu": "1"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "w5-db-data"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "w5-redis",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "selector": {
          "app": "w5-redis"
        },
        "ports": [
          {
            "port": 6379,
            "targetPort": 6379
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "w5-redis",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "w5-redis"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "w5-redis",
              "lesson": "week5b"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "w5-redis",
                "image": "redis:7.4-alpine",
                "args": [
                  "redis-server",
                  "--save",
                  "",
                  "--appendonly",
                  "no"
                ],
                "readinessProbe": {
                  "exec": {
                    "command": [
                      "redis-cli",
                      "ping"
                    ]
                  },
                  "periodSeconds": 3
                },
                "resources": {
                  "requests": {
                    "memory": "32Mi",
                    "cpu": "50m"
                  },
                  "limits": {
                    "memory": "128Mi",
                    "cpu": "500m"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "w5-kafka",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "selector": {
          "app": "w5-kafka"
        },
        "ports": [
          {
            "port": 9092,
            "targetPort": 9092
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "w5-kafka",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "w5-kafka"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "w5-kafka",
              "lesson": "week5b"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "w5-kafka",
                "image": "apache/kafka:4.1.0",
                "env": [
                  {
                    "name": "KAFKA_NODE_ID",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_PROCESS_ROLES",
                    "value": "broker,controller"
                  },
                  {
                    "name": "KAFKA_LISTENERS",
                    "value": "PLAINTEXT://:9092,CONTROLLER://:9093"
                  },
                  {
                    "name": "KAFKA_ADVERTISED_LISTENERS",
                    "value": "PLAINTEXT://w5-kafka:9092"
                  },
                  {
                    "name": "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP",
                    "value": "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
                  },
                  {
                    "name": "KAFKA_CONTROLLER_LISTENER_NAMES",
                    "value": "CONTROLLER"
                  },
                  {
                    "name": "KAFKA_CONTROLLER_QUORUM_VOTERS",
                    "value": "1@localhost:9093"
                  },
                  {
                    "name": "KAFKA_INTER_BROKER_LISTENER_NAME",
                    "value": "PLAINTEXT"
                  },
                  {
                    "name": "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_NUM_PARTITIONS",
                    "value": "1"
                  },
                  {
                    "name": "KAFKA_AUTO_CREATE_TOPICS_ENABLE",
                    "value": "true"
                  },
                  {
                    "name": "KAFKA_LOG_DIRS",
                    "value": "/tmp/kraft-combined-logs"
                  },
                  {
                    "name": "KAFKA_HEAP_OPTS",
                    "value": "-Xms256m -Xmx512m"
                  },
                  {
                    "name": "CLUSTER_ID",
                    "value": "MkU3OEVBNTcwNTJENDM2Qk"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/tmp/kraft-combined-logs"
                  }
                ],
                "readinessProbe": {
                  "tcpSocket": {
                    "port": 9092
                  },
                  "initialDelaySeconds": 15,
                  "periodSeconds": 10,
                  "timeoutSeconds": 5,
                  "failureThreshold": 12
                },
                "resources": {
                  "requests": {
                    "memory": "768Mi",
                    "cpu": "250m"
                  },
                  "limits": {
                    "memory": "1536Mi",
                    "cpu": "2"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    }
  ]
}
