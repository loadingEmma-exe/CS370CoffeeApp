        "name": "w5-web",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "selector": {
          "app": "w5-web"
        },
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "w5-web",
        "namespace": "default",
        "labels": {
          "lesson": "week5b"
        }
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "w5-web"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "w5-web",
              "lesson": "week5b"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "w5-web",
                "image": "python:3.12-slim",
                "command": [
                  "sh",
                  "-c",
                  "pip install --no-cache-dir -r /code/requirements.txt && exec python -u /code/app.py"
                ],
                "env": [
                  {
                    "name": "ROLE",
                    "value": "web"
                  },
                  {
                    "name": "DATABASE_URL",
                    "value": "postgresql://demo:classroom-only@w5-db:5432/orders"
                  },
                  {
                    "name": "KAFKA_BOOTSTRAP_SERVERS",
                    "value": "w5-kafka:9092"
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "code",
                    "mountPath": "/code",
                    "readOnly": true
                  }
                ],
                "resources": {
                  "requests": {
                    "memory": "96Mi",
                    "cpu": "100m"
                  },
                  "limits": {
                    "memory": "384Mi",
                    "cpu": "1"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/health",
                    "port": 8080
                  },
                  "periodSeconds": 3
                }
              }
            ],
            "volumes": [
              {
                "name": "code",
                "configMap": {
                  "name": "w5-code"
                }
              }
            ]
          }
        }
      }
    },
